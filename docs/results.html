  <style>
    .horse { width: 100%; height: 100%; overflow: visible; display: block; }
    .leg { transform-box: fill-box; transform-origin: 50% 8%; }
    .running .leg { animation: gallop .26s ease-in-out infinite alternate; }
    .running .l2, .running .l3 { animation-delay: -.26s; }
    .running .horse { animation: bob .13s ease-in-out infinite alternate; }
    .running .tail { animation: swish .26s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 100% 20%; }
    @keyframes gallop { from { transform: rotate(-32deg); } to { transform: rotate(32deg); } }
    @keyframes bob { from { transform: translateY(0) rotate(-1deg); } to { transform: translateY(-6px) rotate(1.5deg); } }
    @keyframes swish { from { transform: rotate(-14deg); } to { transform: rotate(10deg); } }
    .idle .horse { animation: idle 1.2s ease-in-out infinite alternate; }
    @keyframes idle { from { transform: translateY(0); } to { transform: translateY(-4px) rotate(-1deg); } }

    /* ---- waiting room ---- */
    .stable { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
    .stable .stall { width: 130px; height: 112px; }
    .stable .stall:nth-child(even) .horse { animation-delay: -.6s; }
    .who { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
    .who span { border: 3px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-weight: 700; background: #fff; box-shadow: 3px 3px 0 var(--ink); }
    .who span.v { background: var(--lime); }
    .meter { height: 30px; border: 4px solid var(--ink); border-radius: 999px; background: #fff; overflow: hidden; margin: 14px auto; max-width: 520px; }
    .meter > div { height: 100%; background: repeating-linear-gradient(45deg, var(--pink) 0 14px, var(--orange) 14px 28px); transition: width .6s; animation: slide 1s linear infinite; background-size: 40px 40px; }
    @keyframes slide { to { background-position: 40px 0; } }

    /* ---- the oval ---- */
    .oval-wrap { margin: 24px 0 10px; }
    .oval { position: relative; width: 100%; aspect-ratio: 1000 / 620; filter: drop-shadow(10px 10px 0 var(--ink)); }
    .track-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .runner { position: absolute; left: 0; top: 0; aspect-ratio: 204 / 194; transform-origin: 50% 90%; will-change: transform; }
    .horse-wrap { position: relative; width: 100%; height: 100%; }
    .runner.leader .horse { filter: drop-shadow(0 0 0 #ffd400) drop-shadow(0 0 6px #ffd400) drop-shadow(0 0 3px #ffd400); }
    .runner.leader::after {
      content: '👑'; position: absolute; left: 50%; top: -38%; transform: translateX(-50%); font-size: clamp(12px, 2vw, 22px);
      animation: bob .26s ease-in-out infinite alternate;
    }
    .banner { position: absolute; inset: 0; display: grid; place-items: center; z-index: 2000; pointer-events: none; }
    .banner span {
      font-family: var(--display); font-size: clamp(40px, 9vw, 110px); color: #fff; text-shadow: 5px 5px 0 var(--ink);
      -webkit-text-stroke: 3px var(--ink); transform: scale(0) rotate(-10deg);
    }
    .banner span.go { animation: bang .55s cubic-bezier(.3, 1.8, .5, 1) forwards; }
    @keyframes bang { 0% { transform: scale(0) rotate(-10deg); } 60% { transform: scale(1.1) rotate(4deg); opacity: 1; } 100% { transform: scale(1) rotate(-4deg); opacity: 0; } }
    .dust { position: absolute; left: 4%; bottom: 8%; width: 14%; aspect-ratio: 1; border-radius: 50%; background: #f0d7b3; border: 2px solid var(--ink); opacity: 0; }
    .running .dust { animation: dust .4s linear infinite; }
    .running .dust:nth-child(2) { animation-delay: -.2s; bottom: 18%; }
    @keyframes dust { 0% { opacity: .9; transform: translate(0, 0) scale(.6); } 100% { opacity: 0; transform: translate(-200%, -60%) scale(1.6); } }
    /* Stagger the gallop so the pack doesn't move in lockstep. */
    .runner:nth-child(3n) .leg { animation-duration: .22s; }
    .runner:nth-child(3n+1) .leg { animation-duration: .3s; }

    .finish-strip {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; min-height: 74px;
      margin-top: 22px; padding: 10px 14px; background: #fff; border: 4px solid var(--ink); border-radius: 16px; box-shadow: 6px 6px 0 var(--ink);
    }
    .fin-label { font-family: var(--display); font-size: 20px; padding-top: 4px; margin-right: 4px; }
    .fin { position: relative; display: flex; flex-direction: column; align-items: center; animation: pop .35s cubic-bezier(.3, 1.8, .5, 1); }
    .fin img { width: 54px; height: 54px; object-fit: cover; border: 3px solid var(--ink); border-radius: 10px; box-shadow: 3px 3px 0 var(--c); }
    .fin-n {
      position: absolute; top: -10px; left: -10px; z-index: 1; min-width: 28px; height: 28px; padding: 3px 5px 0; border-radius: 999px;
      background: var(--c); color: #fff; border: 3px solid var(--ink); font-family: var(--display); font-size: 13px; text-align: center; text-shadow: 1px 1px 0 var(--ink);
    }
    .fin-r { font-size: 11px; font-weight: 700; margin-top: 3px; }

    /* ---- podium ---- */
    .podium { display: grid; gap: 26px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); margin-top: 20px; }
    .win {
      background: #fff; border: 5px solid var(--ink); border-radius: 20px; box-shadow: 9px 9px 0 var(--ink); padding: 14px;
      opacity: 0; transform: translateY(30px) rotate(-3deg) scale(.9);
    }
    .win.in { animation: popin .5s cubic-bezier(.3, 1.6, .5, 1) forwards; }
    @keyframes popin { to { opacity: 1; transform: none; } }
    .win:nth-child(odd).in { animation-name: popin-l; }
    @keyframes popin-l { to { opacity: 1; transform: rotate(-1deg); } }
    .win .round {
      display: inline-block; font-family: var(--display); font-size: 26px; color: #fff; text-shadow: 2px 2px 0 var(--ink);
      border: 4px solid var(--ink); border-radius: 12px; padding: 6px 14px 2px; margin: -34px 0 10px -4px; box-shadow: 4px 4px 0 var(--ink);
    }
    .win img, .win video { width: 100%; aspect-ratio: 4/3; object-fit: cover; border: 4px solid var(--ink); border-radius: 12px; display: block; cursor: zoom-in; background: #000; }
    .win .meta { margin-top: 10px; font-weight: 600; }
    .win .meta small { display: block; opacity: .7; font-weight: 400; }
    .also { display: flex; flex-wrap: wrap; gap: 10px; }
    .also img { width: 70px; height: 70px; object-fit: cover; border: 3px solid var(--ink); border-radius: 10px; box-shadow: 3px 3px 0 var(--ink); cursor: zoom-in; }

    details.count { background: #fff; border: 4px solid var(--ink); border-radius: 14px; padding: 10px 14px; margin: 12px 0; box-shadow: 4px 4px 0 var(--ink); }
    details.count summary { cursor: pointer; font-family: var(--display); font-size: 20px; padding-top: 4px; }
    .rnd { margin: 14px 0 6px; font-weight: 700; }
    .bar { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 14px; }
    .bar img { width: 34px; height: 34px; object-fit: cover; border: 2px solid var(--ink); border-radius: 6px; }
    .bar .fill { height: 22px; border: 3px solid var(--ink); border-radius: 6px; min-width: 4px; }
    .bar.out { opacity: .45; }
    .bar.won .fill { background: var(--lime) !important; }
    .tagline { font-weight: 700; }
  </style>
