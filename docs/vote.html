<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cast your ballot · Photo League</title>
  <link rel="stylesheet" href="styles.css?v=mw6gc5yw">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@400;600;700&display=swap">
  <link rel="modulepreload" href="vote.js?v=mw6gc5yw">
  <link rel="modulepreload" href="common.js?v=mw6gc5yw">
  <link rel="modulepreload" href="config.js?v=mw6gc5yw">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏇</text></svg>">
  <style>
    .how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 26px 0 30px; }
    .how div {
      background: #fff; border: 4px solid var(--ink); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow);
      font-weight: 600; display: flex; gap: 10px; align-items: center;
    }
    .how b { font-family: var(--display); font-weight: normal; font-size: 30px; color: #fff; text-shadow: 2px 2px 0 var(--ink);
      background: var(--teal); border: 3px solid var(--ink); border-radius: 50%; min-width: 46px; height: 46px; display: grid; place-items: center; padding-top: 4px; }
    .how div:nth-child(2) b { background: var(--pink); }
    .how div:nth-child(3) b { background: var(--orange); }
    .how div:nth-child(2) { transform: rotate(1deg); }
    @media (max-width: 760px) { .how { grid-template-columns: 1fr; } }

    /* ---------- ballot: a bottom sheet you can drag up, down, or tap ---------- */
    .wrap { padding-bottom: calc(var(--sheet-h, 160px) + 40px); }
    .tray {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; flex-direction: column;
      height: var(--sheet-h, 220px); max-height: 92vh;
      background: var(--purple); color: #fff;
      border: 5px solid var(--ink); border-bottom: 0; border-radius: 24px 24px 0 0;
      box-shadow: 0 -6px 0 rgba(0, 0, 0, .15);
      transition: height .34s cubic-bezier(.2, .9, .3, 1.08);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tray.resizing { transition: none; }
    .sheet-grab { flex: none; padding: 0 14px 10px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
    .tray.resizing .sheet-grab { cursor: grabbing; }
    .sheet-handle {
      display: block; margin: 0 auto; width: 90px; height: 26px; padding: 0; background: none; border: 0; cursor: inherit; touch-action: none;
    }
    .sheet-handle span {
      display: block; width: 58px; height: 9px; margin: 8px auto 0; border-radius: 99px;
      background: #fff; border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
      transition: transform .2s;
    }
    .sheet-grab:hover .sheet-handle span { transform: scaleX(1.12); }
    .tray-inner { max-width: 1100px; width: 100%; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
    .tray h3 .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .tray h3 #trayCount { flex: none; }
    .tray h3 { display: flex; gap: 6px; align-items: baseline; flex: 1; min-width: 0; font-family: var(--display); font-weight: normal; margin: 0; font-size: 20px; text-shadow: 2px 2px 0 var(--ink); white-space: nowrap; }
    #trayCount { display: inline-block; }
    #trayCount.bump { animation: bump .45s cubic-bezier(.3, 1.8, .5, 1); }
    @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.6) rotate(-8deg); } 100% { transform: scale(1); } }
    .tray .hint-peek { display: none; font-family: var(--body); font-size: 12px; font-weight: 600; opacity: .85; text-shadow: none; margin-left: 6px; }
    .tray.collapsed .hint-peek { display: inline; }
    /* The picks wrap into rows and scroll inside the sheet. */
    .slots {
      position: relative; flex: 1; min-height: 0; width: 100%; max-width: 1100px; margin: 0 auto;
      display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px; padding: 12px 14px 16px;
      overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
      border-top: 3px dashed rgba(255, 255, 255, .35);
    }
    .slot {
      position: relative; flex: 0 0 auto; width: 64px; height: 64px; border: 3px solid var(--ink); border-radius: 10px;
      background: #fff center/cover; box-shadow: 3px 3px 0 var(--ink); cursor: grab; touch-action: pan-y; -webkit-touch-callout: none; user-select: none;
    }
    .slot.empty { background: rgba(255,255,255,.18); border-style: dashed; border-color: #fff; box-shadow: none; cursor: default; }
    /* Backups: picks past the number of rounds. Still in play, visibly second-string. */
    .slot.deck { filter: grayscale(.9); opacity: .72; border-style: dashed; box-shadow: none; transition: filter .2s, opacity .2s; }
    .slot.deck.lifted { opacity: 1; }
    .slot.ghost { display: grid; place-items: center; opacity: .55; }
    .slot.ghost .plus { font-family: var(--display); font-size: 30px; line-height: 1; padding-top: 4px; color: #fff; }
    .deck-divider {
      flex: 0 0 100%; display: flex; align-items: center; gap: 10px; margin: 2px 0 4px;
      font-family: var(--display); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: rgba(255, 255, 255, .85);
    }
    .deck-divider::before, .deck-divider::after { content: ''; flex: 1; border-top: 3px dashed rgba(255, 255, 255, .45); }
    .deck-divider.on-light { grid-column: 1 / -1; color: #666; margin: 8px 0 0; }
    .deck-divider.on-light::before, .deck-divider.on-light::after { border-top-color: #bbb; }
    .slot .n {
      position: absolute; top: -10px; left: -10px; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--ink);
      display: grid; place-items: center; font-family: var(--display); font-size: 14px; padding-top: 2px; color: #fff; text-shadow: 1px 1px 0 var(--ink);
      transition: background .15s;
    }
    .sorting .slot:not(.lifted):not(.landing) { transition: transform .22s cubic-bezier(.2, .9, .3, 1.15); }
    .slot.lifted {
      z-index: 10; cursor: grabbing; transition: none;
      box-shadow: 9px 12px 0 rgba(17, 17, 17, .45); outline: 4px solid var(--yellow);
    }
    .slot.landing { z-index: 10; transition: transform .2s cubic-bezier(.2, .9, .3, 1.2); }
    .tray .btn { white-space: nowrap; }
    @media (max-width: 640px) {
      .sheet-grab { padding: 0 10px 8px; }
      .tray-inner { gap: 8px; }
      .tray h3 { font-size: 17px; }
      .tray.collapsed .hint-peek, .tray .hide-sm { display: none; }
      .tray .btn.small { font-size: 14px; padding: 7px 10px 4px; }
      .slots { gap: 8px; padding: 12px 10px 14px; }
      .slot { width: 52px; height: 52px; }
    }

    .done-box { text-align: center; padding: 40px 20px; }
    .done-box .save-row { margin-top: 44px; }
    .switch-row { margin-top: 28px; }
    .switch-row .btn { transform: rotate(-1deg); }
    .done-box .stamp {
      display: inline-block; font-family: var(--display); font-size: clamp(40px, 9vw, 90px); color: var(--pink);
      border: 8px solid var(--pink); border-radius: 18px; padding: 16px 26px 6px; transform: rotate(-8deg);
      background: #fff; box-shadow: 10px 10px 0 var(--ink);
      animation: stamp .5s cubic-bezier(.3, 1.6, .5, 1);
    }
    @keyframes stamp { from { transform: scale(3) rotate(10deg); opacity: 0; } to { transform: scale(1) rotate(-8deg); opacity: 1; } }
    .actions-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="splat" id="title">Photo League</div><br>
      <div class="sub" id="greeting">Loading the stable...</div>
    </header>
    <main id="main"></main>
    <p class="center switch-row"><a class="btn white small" href="index.html" id="switch">🔄 Not you? Switch rider</a></p>
  </div>

  <div class="tray" id="tray" hidden>
    <div class="sheet-grab" id="sheetGrab">
      <button class="sheet-handle" id="sheetHandle" aria-label="Show or hide your ballot" aria-expanded="true"><span></span></button>
      <div class="tray-inner">
        <h3><span class="lbl"><span class="hide-sm">Your </span>ballot</span> <span id="trayCount"></span><span class="hint-peek">tap or drag up</span></h3>
        <button class="btn yellow small" id="clearBtn" title="Clear your whole ballot">✕ Clear all</button>
        <button class="btn small" id="submitBtn">Lock it in!</button>
      </div>
    </div>
    <div class="slots" id="slots"></div>
  </div>

  <script type="module" src="vote.js?v=mw6gc5yw"></script>
</body>
</html>
